name: E2E Smoke

# Wave 2 (TES-20260610-0001): read-only Playwright browser smoke against prod
# (https://ko.taras.cloud) on every push to main, every 6 hours, and on demand.
# Runs ONLY site/tests/e2e/smoke.spec.ts (chromium). BASE_URL is set, so the
# local webServer in playwright.config.ts is skipped (no DB needed).
# Note: @playwright/test lives in the ROOT package.json, not site/.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '37 */6 * * *'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: KO prod E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # Root package.json contains @playwright/test (site/ has only app deps)
      - name: Install Playwright deps (repo root)
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests (read-only, prod)
        run: npx playwright test tests/e2e/smoke.spec.ts --project=chromium --reporter=list,html
        working-directory: site
        env:
          CI: 'true'
          BASE_URL: https://ko.taras.cloud

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
